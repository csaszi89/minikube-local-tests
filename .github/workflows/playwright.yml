name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Sync TestWorkflow definition
      run: kubectl apply -f k8s/testworkflow.yaml
    - name: Run tests in-cluster via Testkube
      run: kubectl testkube run testworkflow minikube-local-tests-e2e -f --download-artifacts --download-dir artifacts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: artifacts/
        retention-days: 30
