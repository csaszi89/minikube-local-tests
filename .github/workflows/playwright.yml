name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Sync TestWorkflow definition
      run: kubectl apply -f k8s/testworkflow.yaml
    - name: Run tests in-cluster via Testkube
      run: kubectl testkube run testworkflow minikube-local-tests-e2e -f --download-artifacts --download-dir artifacts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: artifacts/
        retention-days: 30
    - name: Setup Node
      if: ${{ !cancelled() }}
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      if: ${{ !cancelled() }}
      run: npm ci
    - name: Setup Java (required by Allure)
      if: ${{ !cancelled() }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npx allure generate "$(find artifacts -type d -name allure-results | head -n 1)" --clean -o allure-report
    - name: Publish Allure report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
