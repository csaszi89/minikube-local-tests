name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Sync TestWorkflow definition
      run: kubectl apply -f k8s/minikube-local-tests-e2e.yaml
    - name: Run tests in-cluster via Testkube
      run: kubectl testkube run testworkflow minikube-local-tests-e2e -f --download-artifacts --download-dir artifacts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: artifacts/
        retention-days: 30

  publish-report:
    needs: test
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: playwright-report
        path: artifacts
    - name: Setup Java (required by Allure)
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Generate Allure report
      shell: bash
      run: |
        resultsDir=$(find artifacts -type d -name allure-results | head -n 1)
        if [ -z "$resultsDir" ]; then
          echo "No allure-results directory found under artifacts/"
          exit 1
        fi
        npx --yes allure-commandline generate "$resultsDir" --clean -o allure-report
    - name: Publish Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
