apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: minikube-local-tests-e2e
  namespace: testkube
  labels:
    app: task-manager
spec:
  content:
    git:
      uri: https://github.com/csaszi89/minikube-local-tests.git
      revision: main
  container:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    workingDir: /data/repo
    env:
      - name: K8S_NAMESPACE
        value: default
  steps:
    - name: install-dependencies
      shell: npm ci
    - name: install-browsers
      shell: npx playwright install --with-deps
    - name: run-e2e-tests
      shell: npx playwright test
      artifacts:
        paths:
          - playwright-report/**
          - test-results/**
          - allure-results/**
  pod:
    serviceAccountName: default
